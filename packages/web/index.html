<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Open Artifact — give your agent's work a URL</title>
    <meta
      name="description"
      content="Your coding agent writes a report, a doc, a dashboard. Open Artifact gives it a URL you can share, comment on line by line, and have the agent revise. Self-hosted."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#5b5fd6" />

    <!-- Link previews for Slack, X, HN and anywhere else this URL gets posted. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open Artifact" />
    <meta property="og:title" content="Open Artifact — give your agent's work a URL" />
    <meta
      property="og:description"
      content="Your coding agent writes a report, a doc, a dashboard. Open Artifact gives it a URL you can share, comment on line by line, and have the agent revise. Self-hosted."
    />
    <meta property="og:url" content="https://open-artifact.com" />
    <meta property="og:image" content="https://open-artifact.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Open Artifact — give your agent's work a URL" />
    <meta
      name="twitter:description"
      content="Publish, share and comment on HTML and Markdown from wherever you work. Self-hosted."
    />
    <meta name="twitter:image" content="https://open-artifact.com/og.png" />

    <!--
      Light or dark, decided before anything is drawn.

      This has to run here, blocking, ahead of the stylesheet and the app. If the
      theme were only settled once React mounted, somebody who chose dark would
      get a white page for a frame first — the one flaw people actually notice in
      a dark mode. It is deliberately the smallest thing that can work.

      It mirrors theme.tsx: same storage key, same attribute, same rule for what
      an unrecognised stored value means. Change one, change both.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('oa.theme');
          var explicit = stored === 'light' || stored === 'dark';
          document.documentElement.dataset.theme = explicit
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
